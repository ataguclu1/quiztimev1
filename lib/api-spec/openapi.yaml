openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Quiz Game API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: quizzes
    description: Quiz management
  - name: games
    description: Game session management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /quizzes:
    get:
      operationId: listQuizzes
      tags: [quizzes]
      summary: List all quizzes
      responses:
        "200":
          description: List of quizzes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quiz"
    post:
      operationId: createQuiz
      tags: [quizzes]
      summary: Create a new quiz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuizBody"
      responses:
        "201":
          description: Created quiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quiz"
  /quizzes/{quizId}:
    get:
      operationId: getQuiz
      tags: [quizzes]
      summary: Get a quiz by ID
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quiz details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizWithQuestions"
    put:
      operationId: updateQuiz
      tags: [quizzes]
      summary: Update a quiz
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuizBody"
      responses:
        "200":
          description: Updated quiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quiz"
    delete:
      operationId: deleteQuiz
      tags: [quizzes]
      summary: Delete a quiz
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /quizzes/{quizId}/questions:
    post:
      operationId: addQuestion
      tags: [quizzes]
      summary: Add a question to a quiz
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestionBody"
      responses:
        "201":
          description: Created question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
  /quizzes/{quizId}/questions/{questionId}:
    put:
      operationId: updateQuestion
      tags: [quizzes]
      summary: Update a question
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: integer
        - name: questionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuestionBody"
      responses:
        "200":
          description: Updated question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
    delete:
      operationId: deleteQuestion
      tags: [quizzes]
      summary: Delete a question
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: integer
        - name: questionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /games:
    post:
      operationId: createGame
      tags: [games]
      summary: Start a new game session from a quiz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameBody"
      responses:
        "201":
          description: Created game session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSession"
  /games/{pin}:
    get:
      operationId: getGame
      tags: [games]
      summary: Get game session by PIN
      parameters:
        - name: pin
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Game session details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSession"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Quiz:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        questionCount:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - title
        - description
        - questionCount
        - createdAt
    QuizWithQuestions:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        questions:
          type: array
          items:
            $ref: "#/components/schemas/Question"
        createdAt:
          type: string
      required:
        - id
        - title
        - description
        - questions
        - createdAt
    Question:
      type: object
      properties:
        id:
          type: integer
        quizId:
          type: integer
        text:
          type: string
        options:
          type: array
          items:
            type: string
        correctIndex:
          type: integer
        timeLimit:
          type: integer
        orderIndex:
          type: integer
      required:
        - id
        - quizId
        - text
        - options
        - correctIndex
        - timeLimit
        - orderIndex
    CreateQuizBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
      required:
        - title
    UpdateQuizBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
    CreateQuestionBody:
      type: object
      properties:
        text:
          type: string
        options:
          type: array
          items:
            type: string
        correctIndex:
          type: integer
        timeLimit:
          type: integer
      required:
        - text
        - options
        - correctIndex
    UpdateQuestionBody:
      type: object
      properties:
        text:
          type: string
        options:
          type: array
          items:
            type: string
        correctIndex:
          type: integer
        timeLimit:
          type: integer
    CreateGameBody:
      type: object
      properties:
        quizId:
          type: integer
      required:
        - quizId
    GameSession:
      type: object
      properties:
        id:
          type: integer
        quizId:
          type: integer
        pin:
          type: string
        status:
          type: string
          enum: [waiting, playing, finished]
        createdAt:
          type: string
      required:
        - id
        - quizId
        - pin
        - status
        - createdAt
